name: Render homelab pulse

on:
  push:
    paths:
      - "data/pulse.json"
      - "scripts/render_pulse.py"
  schedule:
    # Safety net in case n8n missed a run. Renders whatever data is current.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Only the render job writes to the repo. Nothing else needs a token.
permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards and update README
        run: python scripts/render_pulse.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets README.md)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "chore: refresh homelab pulse [skip ci]"
          git push
